name: CI (Fedora Linux)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test_fedora:
    name: Fedora Linux Build & Test
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
    - name: Install Fedora System Dependencies
      run: |
        dnf install -y git gcc pkg-config rust cargo

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Verify Fedora Environment
      run: |
        cat /etc/fedora-release
        gcc --version
        rustc --version
        cargo --version

    - name: Cargo Check
      run: cargo check --verbose

    - name: Run Tests
      run: cargo test --verbose

    - name: Build Optimized Release Binary
      run: cargo build --release --verbose
