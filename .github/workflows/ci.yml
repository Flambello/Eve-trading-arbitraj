name: CI (Fedora Linux & Standards QA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build_and_test_fedora:
    name: Fedora Linux Build, Test & Standards QA
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
    - name: Install Fedora System Dependencies & Packaging Tools
      run: |
        dnf install -y git gcc pkg-config rust cargo clippy rustfmt desktop-file-utils

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Verify Environment Toolchains
      run: |
        cat /etc/fedora-release
        gcc --version
        rustc --version
        cargo --version
        desktop-file-validate --version || true

    - name: Validate Desktop Entry File
      run: desktop-file-validate eve-trade.desktop

    - name: Check Code Formatting
      run: cargo fmt --check

    - name: Cargo Check
      run: cargo check --all-targets --verbose

    - name: Clippy Linter
      run: cargo clippy --all-targets -- -D warnings

    - name: Run Test Suites
      run: cargo test --verbose

    - name: Build Optimized Release Binary
      run: cargo build --release --verbose --bin eve-merchant
