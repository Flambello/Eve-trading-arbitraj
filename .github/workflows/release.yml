name: Release (Fedora Linux)

on:
  push:
    tags:
      - "v*"

jobs:
  build_release_fedora:
    name: Build Fedora Linux x86_64 Binary
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
    - name: Install Fedora System Dependencies
      run: |
        dnf install -y git gcc pkg-config rust cargo tar gzip

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build Optimized Release Binary
      run: cargo build --release

    - name: Package Fedora Release Archive
      run: |
        mkdir -p package
        cp target/release/eve-trade package/
        cp README.md LICENSE package/
        tar -czf eve-trade-scout-fedora-x86_64.tar.gz -C package .

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: eve-trade-scout-fedora-x86_64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
