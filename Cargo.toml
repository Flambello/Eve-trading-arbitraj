[package]
name = "eve-trade-scout"
version = "0.1.0"
edition = "2021"
description = "EVE Online location-centric arbitrage route planner & multi-item cargo knapsack optimizer"
authors = ["Flambello <28274575+Flambello@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Flambello/eve-traveling-merchant"
homepage = "https://github.com/Flambello/eve-traveling-merchant"
keywords = ["eve-online", "trading", "arbitrage", "route-planner", "cross-platform"]
categories = ["games", "gui"]
exclude = [".agents/", "data/", "cache/", "*.sqlite*", "*.bz2", ".github/"]

[lib]
name = "eve_trade_scout"
path = "src/lib.rs"

[[bin]]
name = "eve-merchant"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
petgraph = "0.6"
lru = "0.12"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
dirs = "5.0"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.28", features = ["default"] }
ring = "0.17"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
