app-id: io.github.flambello.eve_merchant
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: eve-merchant

finish-args:
  # Network access for live CCP ESI market orders and Fuzzwork SDE database
  - --share=network
  # Display & Windowing (Wayland native + X11 fallback)
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Hardware accelerated OpenGL for egui / glow renderer
  - --device=dri
  # Sound alert notifications via PulseAudio / PipeWire
  - --socket=pulseaudio
  # Desktop notification banner popups
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/eve-merchant/cargo

modules:
  - name: eve-merchant
    buildsystem: simple
    build-commands:
      # Build the optimized release binary offline using vendored / pre-fetched cargo sources
      - cargo --offline build --release --bin eve-merchant
      # Install binary
      - install -Dm755 target/release/eve-merchant /app/bin/eve-merchant
      # Install Freedesktop desktop entry
      - install -Dm644 packaging/flatpak/io.github.flambello.eve_merchant.desktop /app/share/applications/io.github.flambello.eve_merchant.desktop
      # Install AppStream 1.0 metadata
      - install -Dm644 packaging/flatpak/io.github.flambello.eve_merchant.metainfo.xml /app/share/metainfo/io.github.flambello.eve_merchant.metainfo.xml
      # Install multi-resolution application icons
      - install -Dm644 assets/icons/hicolor/128x128/apps/io.github.flambello.eve_merchant.png /app/share/icons/hicolor/128x128/apps/io.github.flambello.eve_merchant.png
      - install -Dm644 assets/icons/hicolor/256x256/apps/io.github.flambello.eve_merchant.png /app/share/icons/hicolor/256x256/apps/io.github.flambello.eve_merchant.png
      - install -Dm644 assets/icons/hicolor/512x512/apps/io.github.flambello.eve_merchant.png /app/share/icons/hicolor/512x512/apps/io.github.flambello.eve_merchant.png
      - install -Dm644 assets/icons/hicolor/scalable/apps/io.github.flambello.eve_merchant.svg /app/share/icons/hicolor/scalable/apps/io.github.flambello.eve_merchant.svg
    sources:
      - type: git
        url: https://github.com/Flambello/eve-traveling-merchant.git
        tag: v0.1.0
      # Cargo sources generated for Flathub offline build via flatpak-cargo-generator:
      - cargo-sources.json
